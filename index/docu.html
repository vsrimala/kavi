<!DOCTYPE html>
<html>
<head>
    <title>Login & Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-image: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");
            background-size: cover;
            background-position: center;
        }

        .container {
            width: 340px;
            background: white;
            padding: 35px 30px;
            box-shadow: 0 5px 20px rgba(146, 19, 19, 0.3);
        }

        h1 {
            text-align: center;
            color: #ff1744;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .tabs button {
            width: 110px;
            padding: 10px;
            border: none;
            cursor: pointer;
            background: #f5f5f5;
        }

        .tabs button:first-child {
            background: linear-gradient(90deg, #ff1744, #ff9800);
            color: white;
            border-radius: 20px 0 0 20px;
        }

        .tabs button:last-child {
            border-radius: 0 20px 20px 0;
        }

        .social {
            text-align: center;
            margin-bottom: 25px;
        }

        .social span {
            display: inline-block;
            margin: 0 2px;
            padding: 11px;
            background: #ff6d00;
            color: white;
            border-radius: 2px;
            font-weight: bold;
        }

        input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #aaa;
            padding: 12px 2px;
            margin-bottom: 20px;
            outline: none;
        }

        .remember {
            font-size: 13px;
            color: #777;
        }

        .remember input {
            width: auto;
            margin-right: 5px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #ff1744, #ff9800);
            color: white;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.85;
        }

        /* Popup */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .popup-box {
            background: white;
            width: 300px;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        .popup-box h2 {
            color: #ff5722;
        }

        .popup-box button {
            padding: 10px 30px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(90deg, #ff1744, #ff9800);
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Login</h1>

    <div class="tabs">
        <button onclick="showLogin()">Log In</button>
        <button onclick="showRegister()">Register</button>
    </div>

    <div class="social">
        <span>G</span>
        <span>I</span>
        <span>T</span>
        <span>H</span>
        <span>U</span>
        <span>B</span>
    </div>

    <div id="loginForm">
        <input type="text" id="userId" placeholder="User Id">
        <input type="text" id="password" placeholder="password">

        <label class="remember">
            <input type="checkbox">
            Remember Password
        </label>

        <button class="login-btn" onclick="login()">Log In</button>
    </div>

    <div id="registerForm" style="display:none;">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="email" id="email" placeholder="Enter Email">
        <input type="password" id="regPassword" placeholder="Enter Password">

        <button class="login-btn" onclick="register()">Register</button>
    </div>

</div>


<div class="popup" id="popup">
    <div class="popup-box">
        <h2 id="popupTitle">Success!</h2>
        <p id="popupMessage"></p>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<script>
    function showLogin() {
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("registerForm").style.display = "none";
    }

    function showRegister() {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("registerForm").style.display = "block";
    }

    function login() {
        let user = document.getElementById("userId").value;
        let password = document.getElementById("password").value;

        if (user === "" || password === "") {
            showPopup("Error", "Please fill all the fields.");
        } else {
            showPopup("Login Successful", "Welcome! You have logged in successfully.");
        }
    }

    function register() {
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let password = document.getElementById("regPassword").value;

        if (name === "" || email === "" || password === "") {
            showPopup("Error", "Please fill all the fields.");
        } else {
            showPopup("Registration Successful", "Your account has been created.");
        }
    }

    function showPopup(title, message) {
        document.getElementById("popupTitle").innerText = title;
        document.getElementById("popupMessage").innerText = message;
        document.getElementById("popup").style.display = "flex";
    }

    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }
</script>

</body>
</html>
